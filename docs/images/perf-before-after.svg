<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" width="780" height="420" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Paged engine: before vs after the optimizations</title>
<desc id="d">Insert loop fell from 23.1 s to 0.0047 s. Including the flush on close it fell from about 23.1 s to 0.17 s. Random reads did not change: 0.19 s before, 0.21 s after.</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
<marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker>
<marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker>
</defs>
<rect x="0.5" y="0.5" width="779" height="419" rx="12" fill="#fcfcfb" stroke="#dddcd6"/>
<text x="40" y="34" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Paged engine: before vs after the optimizations</text>
<text x="40" y="54" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">100,000 records · 1,500-frame pool · seconds, logarithmic axis (lower is better)</text>
<line x1="100" y1="316.0" x2="740" y2="316.0" stroke="#e8e7e2" stroke-width="1"/>
<text x="92" y="320.0" font-size="11" fill="#52514e" font-weight="400" text-anchor="end">0.001 s</text>
<line x1="100" y1="274.4" x2="740" y2="274.4" stroke="#e8e7e2" stroke-width="1"/>
<text x="92" y="278.4" font-size="11" fill="#52514e" font-weight="400" text-anchor="end">0.01 s</text>
<line x1="100" y1="232.8" x2="740" y2="232.8" stroke="#e8e7e2" stroke-width="1"/>
<text x="92" y="236.8" font-size="11" fill="#52514e" font-weight="400" text-anchor="end">0.1 s</text>
<line x1="100" y1="191.2" x2="740" y2="191.2" stroke="#e8e7e2" stroke-width="1"/>
<text x="92" y="195.2" font-size="11" fill="#52514e" font-weight="400" text-anchor="end">1 s</text>
<line x1="100" y1="149.6" x2="740" y2="149.6" stroke="#e8e7e2" stroke-width="1"/>
<text x="92" y="153.6" font-size="11" fill="#52514e" font-weight="400" text-anchor="end">10 s</text>
<line x1="100" y1="108.0" x2="740" y2="108.0" stroke="#e8e7e2" stroke-width="1"/>
<text x="92" y="112.0" font-size="11" fill="#52514e" font-weight="400" text-anchor="end">100 s</text>
<path d="M132.7,316 V139.5 a5,5 0 0 1 5,-5 h60.0 a5,5 0 0 1 5,5 V316 Z" fill="#eb6834"/>
<text x="167.7" y="127.5" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="middle">23.1 s</text>
<path d="M210.7,316 V293.0 a5,5 0 0 1 5,-5 h60.0 a5,5 0 0 1 5,5 V316 Z" fill="#2a78d6"/>
<text x="245.7" y="281.0" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="middle">0.0047 s</text>
<text x="206.7" y="338" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="middle">Insert loop</text>
<text x="206.7" y="358" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="middle">≈4,900× faster</text>
<path d="M346.0,316 V139.5 a5,5 0 0 1 5,-5 h60.0 a5,5 0 0 1 5,5 V316 Z" fill="#eb6834"/>
<text x="381.0" y="127.5" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="middle">23.1 s</text>
<path d="M424.0,316 V227.9 a5,5 0 0 1 5,-5 h60.0 a5,5 0 0 1 5,5 V316 Z" fill="#2a78d6"/>
<text x="459.0" y="215.9" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="middle">0.1730 s</text>
<text x="420.0" y="338" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="middle">Insert incl. flush on close</text>
<text x="420.0" y="358" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="middle">≈130× faster</text>
<path d="M559.3,316 V226.3 a5,5 0 0 1 5,-5 h60.0 a5,5 0 0 1 5,5 V316 Z" fill="#eb6834"/>
<text x="594.3" y="214.3" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="middle">0.1890 s</text>
<path d="M637.3,316 V224.7 a5,5 0 0 1 5,-5 h60.0 a5,5 0 0 1 5,5 V316 Z" fill="#2a78d6"/>
<text x="672.3" y="212.7" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="middle">0.2060 s</text>
<text x="633.3" y="338" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="middle">Random read</text>
<text x="633.3" y="358" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="middle">unchanged</text>
<line x1="100" y1="316" x2="740" y2="316" stroke="#8a8985" stroke-width="1.5"/>
<rect x="100" y="70" width="12" height="12" rx="3" fill="#eb6834"/>
<text x="118" y="81" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">before — flush on every record</text>
<rect x="352" y="70" width="12" height="12" rx="3" fill="#2a78d6"/>
<text x="370" y="81" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">after — deferred writes</text>
</svg>
