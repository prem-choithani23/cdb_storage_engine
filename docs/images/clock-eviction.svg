<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 385" width="780" height="385" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Clock eviction</title>
<desc id="d">Eight frames in a ring with a rotating hand. Pinned frames are skipped, frames with the reference bit set get a second chance, and the first unpinned frame with a clear bit is evicted.</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
<marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker>
<marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker>
</defs>
<rect x="0.5" y="0.5" width="779" height="384" rx="12" fill="#fcfcfb" stroke="#dddcd6"/>
<text x="40" y="36" font-size="16" fill="#0b0b0b" font-weight="700" text-anchor="start">Clock eviction</text>
<circle cx="190.0" cy="103.0" r="34" fill="#efeeea" stroke="#8a8985" stroke-width="1.5"/>
<text x="190.0" y="101.0" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="middle">F0</text>
<text x="190.0" y="116.0" font-size="9" fill="#52514e" font-weight="400" text-anchor="middle">pin 1 · ref 1</text>
<circle cx="269.2" cy="135.8" r="34" fill="#e6f0fb" stroke="#2a78d6" stroke-width="3"/>
<text x="269.2" y="133.8" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="middle">F1</text>
<text x="269.2" y="148.8" font-size="9" fill="#52514e" font-weight="400" text-anchor="middle">pin 0 · ref 1</text>
<circle cx="302.0" cy="215.0" r="34" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="302.0" y="213.0" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="middle">F2</text>
<text x="302.0" y="228.0" font-size="9" fill="#52514e" font-weight="400" text-anchor="middle">pin 0 · ref 1</text>
<circle cx="269.2" cy="294.2" r="34" fill="#efeeea" stroke="#8a8985" stroke-width="1.5"/>
<text x="269.2" y="292.2" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="middle">F3</text>
<text x="269.2" y="307.2" font-size="9" fill="#52514e" font-weight="400" text-anchor="middle">pin 1 · ref 0</text>
<circle cx="190.0" cy="327.0" r="34" fill="#8fb9ec" stroke="#2a78d6" stroke-width="1.5"/>
<text x="190.0" y="325.0" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="middle">F4</text>
<text x="190.0" y="340.0" font-size="9" fill="#52514e" font-weight="400" text-anchor="middle">pin 0 · ref 0</text>
<circle cx="110.8" cy="294.2" r="34" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="110.8" y="292.2" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="middle">F5</text>
<text x="110.8" y="307.2" font-size="9" fill="#52514e" font-weight="400" text-anchor="middle">pin 0 · ref 1</text>
<circle cx="78.0" cy="215.0" r="34" fill="#8fb9ec" stroke="#2a78d6" stroke-width="1.5"/>
<text x="78.0" y="213.0" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="middle">F6</text>
<text x="78.0" y="228.0" font-size="9" fill="#52514e" font-weight="400" text-anchor="middle">pin 0 · ref 0</text>
<circle cx="110.8" cy="135.8" r="34" fill="#efeeea" stroke="#8a8985" stroke-width="1.5"/>
<text x="110.8" y="133.8" font-size="12" fill="#0b0b0b" font-weight="700" text-anchor="middle">F7</text>
<text x="110.8" y="148.8" font-size="9" fill="#52514e" font-weight="400" text-anchor="middle">pin 1 · ref 1</text>
<line x1="190" y1="215" x2="226.8" y2="178.2" stroke="#0b0b0b" stroke-width="3" marker-end="url(#ar)"/>
<circle cx="190" cy="215" r="5" fill="#0b0b0b"/>
<text x="190" y="239" font-size="10" fill="#52514e" font-weight="400" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">clock_hand</text>
<text x="400" y="80" font-size="14" fill="#0b0b0b" font-weight="700" text-anchor="start">For each frame under the hand:</text>
<circle cx="414" cy="121" r="13" fill="#efeeea" stroke="#8a8985" stroke-width="1.5"/>
<text x="440" y="119" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">pin_count &gt; 0</text>
<text x="440" y="137" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">pinned — skip, advance hand</text>
<circle cx="414" cy="175" r="13" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="440" y="173" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ref_bit = 1</text>
<text x="440" y="191" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">second chance — clear it, advance</text>
<circle cx="414" cy="229" r="13" fill="#8fb9ec" stroke="#2a78d6" stroke-width="1.5"/>
<text x="440" y="227" font-size="13" fill="#0b0b0b" font-weight="700" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ref_bit = 0, unpinned</text>
<text x="440" y="245" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">VICTIM — write back if dirty, reuse</text>
<text x="400" y="292" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">Every hit sets ref_bit = 1, so hot pages survive a sweep.</text>
<text x="400" y="310" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">Cost per eviction decision is O(1) amortised — no ordered list.</text>
<text x="400" y="328" font-size="12" fill="#52514e" font-weight="400" text-anchor="start">If every frame is pinned the sweep never ends: always unpin.</text>
</svg>
