<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" width="780" height="520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Layered architecture</title>
<desc id="d">Table API calls Heap File, which uses the Buffer Pool and Slotted Page. The Buffer Pool calls the Disk Manager, which talks to the Linux kernel.</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
<marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker>
<marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker>
</defs>
<rect x="0.5" y="0.5" width="779" height="519" rx="12" fill="#fcfcfb" stroke="#dddcd6"/>
<rect x="40" y="30" width="400" height="70" rx="8" fill="#ece9fa" stroke="#4a3aa7" stroke-width="1.5"/>
<text x="240.0" y="47.0" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="middle">Table API</text>
<text x="240.0" y="65.0" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle">insert_data · read_data · update_data · delete_data</text>
<text x="240.0" y="81.0" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle">src/storage/table_api.c</text>
<rect x="40" y="130" width="400" height="70" rx="8" fill="#e1f5ee" stroke="#1baf7a" stroke-width="1.5"/>
<text x="240.0" y="147.0" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="middle">Heap File</text>
<text x="240.0" y="165.0" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle">a table = a chain of pages; hands out TIDs</text>
<text x="240.0" y="181.0" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle">src/storage/heap_file.c</text>
<rect x="40" y="230" width="400" height="70" rx="8" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="240.0" y="247.0" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="middle">Buffer Pool</text>
<text x="240.0" y="265.0" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle">420 frames · page table · pin/unpin · dirty bits · Clock</text>
<text x="240.0" y="281.0" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle">src/buffer/buffer_pool.c · page_table.c</text>
<rect x="40" y="330" width="400" height="70" rx="8" fill="#fdece4" stroke="#eb6834" stroke-width="1.5"/>
<text x="240.0" y="347.0" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="middle">Disk Manager</text>
<text x="240.0" y="365.0" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle">the only code that touches a file descriptor</text>
<text x="240.0" y="381.0" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle">src/disk/disk_manager.c</text>
<rect x="40" y="430" width="400" height="70" rx="8" fill="#efeeea" stroke="#8a8985" stroke-width="1.5"/>
<text x="240.0" y="447.0" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="middle">Linux kernel</text>
<text x="240.0" y="465.0" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle">open(O_DIRECT) · pread · pwrite · ftruncate</text>
<text x="240.0" y="481.0" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle">bypasses the OS page cache</text>
<line x1="240.0" y1="100" x2="240.0" y2="130" stroke="#52514e" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="240.0" y1="200" x2="240.0" y2="230" stroke="#52514e" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="240.0" y1="300" x2="240.0" y2="330" stroke="#52514e" stroke-width="1.6" marker-end="url(#ar)"/>
<line x1="240.0" y1="400" x2="240.0" y2="430" stroke="#52514e" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="540" y="130" width="200" height="170" rx="8" fill="#fdf3d9" stroke="#eda100" stroke-width="1.5"/>
<text x="640.0" y="157.0" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="middle">Slotted Page</text>
<text x="640.0" y="175.0" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle">page_insert / read /</text>
<text x="640.0" y="191.0" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle">update / delete</text>
<text x="640.0" y="207.0" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle"></text>
<text x="640.0" y="223.0" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle">pure in-memory logic:</text>
<text x="640.0" y="239.0" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle">works on a Page* that</text>
<text x="640.0" y="255.0" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle">is already in a frame</text>
<text x="640.0" y="271.0" font-size="12" fill="#52514e" font-weight="400" text-anchor="middle">src/storage/slotted_page.c</text>
<line x1="440" y1="165" x2="540" y2="165" stroke="#52514e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="490" y="156" font-size="11" fill="#52514e" font-weight="400" text-anchor="middle">calls</text>
<line x1="440" y1="265" x2="540" y2="265" stroke="#52514e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/>
<text x="490" y="256" font-size="11" fill="#52514e" font-weight="400" text-anchor="middle">frames hold</text>
<text x="490" y="282" font-size="11" fill="#52514e" font-weight="400" text-anchor="middle">Page structs</text>
<text x="250.0" y="119" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">TID (page_id, slot_id)</text>
<text x="250.0" y="219" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">fetch_page / unpin_page(dirty?)</text>
<text x="250.0" y="319" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">disk_read_page / disk_write_page</text>
<text x="250.0" y="419" font-size="11" fill="#52514e" font-weight="400" text-anchor="start">4096-byte aligned I/O</text>
</svg>
